<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="user name">user name</label>
        <input type="text" name="user name" placeholder="Enter your name" required>
        <br>
        <label for="Email">Email Address</label>
        <input type="email" name="Email" placeholder="Enter your Email Address">
        <br>
        <label for="password">Password</label>
        <input type="password" name="Password" placeholder="Enter your password">
        <br>
        <label for="date of birth">Date of Birth</label>
        <input type="date" name="Date of Birth" placeholder="Enter your Date of Birth">
        <br>
        <label for="pincode">pincode</label>
        <input type="number" name="Pincode" placeholder="Enter your pincode">
        <br>
        <label for="Files">Files</label>
        <input type="file" name="Files" placeholder="Search for Files">
        <br>
        <label for="Gender">Gender</label>
        <input type="radio" value="Male" name="Gender">Male
        <input type="radio" value="Female" name="Gender">Female
        <br>
        <label for="courses">Courses</label>
        <input type="checkbox" value="IT" name="courses">IT
        <input type="checkbox" value="CSE" name="courses">CSE
        <input type="checkbox" value="AIDS" name="courses">AIDS
        <br>
        <label for="city">City</label>
        <select name="cities" id="">
            <option value="Chn">chennai</option>
            <option value="Mdu">Madurai</option>
            <option value="Tch">Trich</option>
            <option value="Kum">Kumbakonam</option>
            <option value="Tbm">Tambaram</option>
        </select>
        <br>
        <button type="submit">Register</button>
        <button type="reset">Refresh</button>
    </form>
</body>
</html>
